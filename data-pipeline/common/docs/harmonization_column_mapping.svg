<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">การจับคู่คอลัมน์ NSL-KDD และ UNSW-NB15 หลัง Harmonization</title>
  <desc id="desc">ตารางเปรียบเทียบคอลัมน์เดิมจาก NSL-KDD และ UNSW-NB15 กับชื่อคอลัมน์มาตรฐานกลาง จำนวนหกแถว</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#EDF3FA"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#153B63"/>
      <stop offset="1" stop-color="#176B78"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#16324F" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: "Leelawadee UI", Tahoma, "Noto Sans Thai", sans-serif; }
      .mono { font-family: Consolas, "Courier New", monospace; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="75" r="175" fill="#DCEAF2" opacity=".42"/>
  <circle cx="80" cy="860" r="170" fill="#D8E8F1" opacity=".35"/>

  <rect x="96" y="58" width="388" height="38" rx="19" fill="#DCEFEB"/>
  <text x="290" y="84" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="1.2" fill="#176B62">COMMON DATASET  ·  HARMONIZATION</text>
  <text x="96" y="158" font-size="46" font-weight="700" fill="#142F49">จากคอลัมน์เดิม สู่รูปแบบกลาง</text>
  <text x="98" y="202" font-size="22" fill="#52677D">จับคู่ข้อมูล NSL-KDD และ UNSW-NB15 ตามความหมาย ก่อนนำไปใช้ร่วมกัน</text>

  <g filter="url(#shadow)">
    <rect x="96" y="250" width="1408" height="494" rx="22" fill="#FFFFFF"/>
    <path d="M118 250h1364a22 22 0 0 1 22 22v66H96v-66a22 22 0 0 1 22-22z" fill="url(#header)"/>
    <text x="330" y="304" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">ชื่อคอลัมน์เดิม · NSL-KDD</text>
    <text x="800" y="304" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">ชื่อคอลัมน์เดิม · UNSW-NB15</text>
    <text x="1270" y="304" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">หลัง Harmonization</text>

    <line x1="565" y1="272" x2="565" y2="744" stroke="#E5EBF1" stroke-width="2"/>
    <line x1="1035" y1="272" x2="1035" y2="744" stroke="#E5EBF1" stroke-width="2"/>

    <g fill="#F7F9FC">
      <rect x="97" y="338" width="1406" height="66"/>
      <rect x="97" y="470" width="1406" height="66"/>
      <rect x="97" y="602" width="1406" height="66"/>
    </g>
    <g stroke="#E8EDF2" stroke-width="1.5">
      <line x1="96" y1="404" x2="1504" y2="404"/>
      <line x1="96" y1="470" x2="1504" y2="470"/>
      <line x1="96" y1="536" x2="1504" y2="536"/>
      <line x1="96" y1="602" x2="1504" y2="602"/>
      <line x1="96" y1="668" x2="1504" y2="668"/>
    </g>

    <g font-size="25" fill="#263D53">
      <text class="mono" x="330" y="380" text-anchor="middle">duration</text>
      <text class="mono" x="800" y="380" text-anchor="middle">dur</text>
      <text class="mono" x="1270" y="380" text-anchor="middle" font-weight="700" fill="#116B67">duration</text>

      <text class="mono" x="330" y="446" text-anchor="middle">protocol_type</text>
      <text class="mono" x="800" y="446" text-anchor="middle">proto</text>
      <text class="mono" x="1270" y="446" text-anchor="middle" font-weight="700" fill="#116B67">protocol</text>

      <text class="mono" x="330" y="512" text-anchor="middle">src_bytes</text>
      <text class="mono" x="800" y="512" text-anchor="middle">sbytes</text>
      <text class="mono" x="1270" y="512" text-anchor="middle" font-weight="700" fill="#116B67">bytes_forward</text>

      <text class="mono" x="330" y="578" text-anchor="middle">dst_bytes</text>
      <text class="mono" x="800" y="578" text-anchor="middle">dbytes</text>
      <text class="mono" x="1270" y="578" text-anchor="middle" font-weight="700" fill="#116B67">bytes_backward</text>

      <text class="mono" x="330" y="644" text-anchor="middle">service</text>
      <text class="mono" x="800" y="644" text-anchor="middle">service</text>
      <text class="mono" x="1270" y="644" text-anchor="middle" font-weight="700" fill="#116B67">service_group</text>

      <text class="mono" x="330" y="710" text-anchor="middle">flag</text>
      <text class="mono" x="800" y="710" text-anchor="middle">state</text>
      <text class="mono" x="1270" y="710" text-anchor="middle" font-weight="700" fill="#116B67">conn_state_group</text>
    </g>
  </g>

  <rect x="96" y="778" width="1408" height="78" rx="18" fill="#E7F2F1" stroke="#C9E2DE" stroke-width="1.5"/>
  <circle cx="132" cy="817" r="15" fill="#16766F"/>
  <path d="M125 817l5 5 10-11" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="164" y="812" font-size="19" font-weight="700" fill="#174B4C">ไม่ได้เปลี่ยนแค่ชื่อคอลัมน์</text>
  <text x="164" y="839" font-size="17" fill="#45696A">duration ใช้หน่วยวินาที · protocol ใช้หมวดมาตรฐาน · service และสถานะการเชื่อมต่อถูกจัดกลุ่มให้เทียบกันได้</text>
  <text x="1504" y="881" text-anchor="end" font-size="14" fill="#718399">แหล่งที่มา: feature_contract.json และขั้น Harmonization ของ NSL-KDD / UNSW-NB15</text>
</svg>
