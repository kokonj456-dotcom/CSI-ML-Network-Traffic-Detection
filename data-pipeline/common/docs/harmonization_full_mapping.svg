  <text x="136" y="992" font-size="16" font-weight="700" fill="#174B4C">ช่องที่ไม่มีข้อมูลจะคงเป็น missing ไม่เติมศูนย์; labels และ metadata ถูกแยกคนละตาราง ไม่รวมใน 21 ฟิลด์นี้</text>
  <text x="112" y="1025" font-size="15" fill="#45696A">ขั้น common feature engineering มี candidate เพิ่มแยกต่างหาก: total_bytes · flow_throughput_bytes_per_sec · is_zero_duration · service_state_combo — ยังไม่รวมใน joint_v1</text>
