<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">ตาราง Harmonization คอลัมน์ NSL-KDD และ UNSW-NB15 ครบ 21 ฟิลด์</title>
  <desc id="desc">ตารางสามคอลัมน์แสดงชื่อคอลัมน์ต้นฉบับของ NSL-KDD, UNSW-NB15 และชื่อหลัง Harmonization โดยแบ่งคอลัมน์ที่มีร่วมกันและฟีเจอร์เฉพาะแต่ละชุดข้อมูล</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173C63"/>
      <stop offset="1" stop-color="#146C72"/>
    </linearGradient>
    <style>
      text { font-family: "Leelawadee UI", Tahoma, "Noto Sans Thai", sans-serif; }
      .mono { font-family: Consolas, "Courier New", monospace; }
    </style>
  </defs>
  <text x="86" y="126" font-size="40" font-weight="700" fill="#142F49">Harmonization: จับคู่คอลัมน์ NSL-KDD และ UNSW-NB15</text>
  <text x="88" y="164" font-size="20" fill="#52677D">แสดงครบ 21 ฟิลด์ใน schema ของตาราง features — ช่อง “ไม่มี” หมายถึงไม่มีข้อมูลจากต้นทางชุดนั้น</text>

